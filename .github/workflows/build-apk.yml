name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack Android source
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q source/AI-HQ-Alex-Android-Repo.zip -d build-src
          test -f build-src/AI-HQ-Alex-Android/settings.gradle

      - name: Build debug APK
        working-directory: build-src/AI-HQ-Alex-Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p out
          cp build-src/AI-HQ-Alex-Android/app/build/outputs/apk/debug/app-debug.apk out/AI-HQ-Alex-debug.apk
          sha256sum out/AI-HQ-Alex-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-HQ-Alex-debug-apk
          path: out/AI-HQ-Alex-debug.apk
          if-no-files-found: error
