name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -20
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Reconstruct Android source
        run: |
          rm -rf build-src
          mkdir -p build-src
          cat source-b64/part*.txt > /tmp/aihq-source.b64
          base64 -d /tmp/aihq-source.b64 > /tmp/aihq-source.tar.gz
          echo "907f49ee4918baaf65c2e51b1ef9412249b5d5cf50467bddfb4eb4b54b5ee3c4  /tmp/aihq-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/aihq-source.tar.gz -C build-src
          test -f build-src/AI-HQ-Alex-Android/settings.gradle

      - name: Build debug APK
        working-directory: build-src/AI-HQ-Alex-Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p out
          cp build-src/AI-HQ-Alex-Android/app/build/outputs/apk/debug/app-debug.apk out/AI-HQ-Alex-debug.apk
          sha256sum out/AI-HQ-Alex-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-HQ-Alex-debug-apk
          path: out/AI-HQ-Alex-debug.apk
          if-no-files-found: error
