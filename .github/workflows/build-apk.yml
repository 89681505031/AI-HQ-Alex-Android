name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test V9 production gateway
        run: |
          cd gateway-v9
          npm run check
          AIHQ_MOCK=1 AIHQ_SESSION_TOKEN=test-session AIHQ_JOB_SECRET=test-secret GITHUB_OWNER=mock-owner npm run selftest

      - name: Reconstruct Android source
        run: |
          rm -rf build-src
          mkdir -p build-src
          cat source-b64/part*.txt > /tmp/aihq-source.b64
          base64 -d /tmp/aihq-source.b64 > /tmp/aihq-source.tar.gz
          echo "907f49ee4918baaf65c2e51b1ef9412249b5d5cf50467bddfb4eb4b54b5ee3c4  /tmp/aihq-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/aihq-source.tar.gz -C build-src
          test -f build-src/AI-HQ-Alex-Android/settings.gradle

      - name: Apply V6 + V7 + V8 + V9 modules
        run: |
          ASSETS="build-src/AI-HQ-Alex-Android/app/src/main/assets"
          for v in 6 7 8 9; do
            cp "patches/v${v}.js" "$ASSETS/v${v}.js"
            cp "patches/v${v}.css" "$ASSETS/v${v}.css"
            node --check "$ASSETS/v${v}.js"
          done
          python3 - <<'PY'
          from pathlib import Path
          root=Path("build-src/AI-HQ-Alex-Android")
          index=root/"app/src/main/assets/index.html"
          s=index.read_text()
          s=s.replace("AI HQ: Алекс — V5","AI HQ: Алекс — V9")
          s=s.replace(
            '<link rel="stylesheet" href="styles.css" />',
            '<link rel="stylesheet" href="styles.css" />\n'
            '  <link rel="stylesheet" href="v6.css" />\n'
            '  <link rel="stylesheet" href="v7.css" />\n'
            '  <link rel="stylesheet" href="v8.css" />\n'
            '  <link rel="stylesheet" href="v9.css" />'
          )
          s=s.replace(
            '<script src="app.js"></script>',
            '<script src="app.js"></script>\n'
            '  <script src="v6.js"></script>\n'
            '  <script src="v7.js"></script>\n'
            '  <script src="v8.js"></script>\n'
            '  <script src="v9.js"></script>'
          )
          index.write_text(s)
          gradle=root/"app/build.gradle"
          g=gradle.read_text()
          g=g.replace("targetSdk 27","targetSdk 35")
          g=g.replace("versionCode 5","versionCode 11")
          g=g.replace("versionName '5.0'","versionName '9.2'")
          gradle.write_text(g)
          PY
          grep -q 'v9.js' "$ASSETS/index.html"
          grep -q "versionName '9.2'" build-src/AI-HQ-Alex-Android/app/build.gradle

      - name: Build debug APK
        working-directory: build-src/AI-HQ-Alex-Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p out
          cp build-src/AI-HQ-Alex-Android/app/build/outputs/apk/debug/app-debug.apk out/AI-HQ-Alex-v9.2-fixed-debug.apk
          sha256sum out/AI-HQ-Alex-v9.2-fixed-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-HQ-Alex-v9.2-fixed-debug-apk
          path: out/AI-HQ-Alex-v9.2-fixed-debug.apk
          if-no-files-found: error
