name: Deploy V9 Gateway

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'gateway-v9/**'
      - '.github/workflows/deploy-gateway.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'gateway-v9/**'
      - '.github/workflows/deploy-gateway.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check Vercel deployment token
        id: check
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.GATEWAY_VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Gateway deploy not configured::Missing secret name: GATEWAY_VERCEL_TOKEN"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-v9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate gateway source
        run: |
          npm run check
          AIHQ_MOCK=1 AIHQ_SESSION_TOKEN=test AIHQ_JOB_SECRET=test GITHUB_OWNER=mock-owner npm run selftest

  deploy:
    needs: [preflight, validate]
    if: github.event_name != 'pull_request' && needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create or recover Vercel project and deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.GATEWAY_VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_tw15Bc9UJwCXpN8thgLHLRAz
          VERCEL_SCOPE: alexpimenov6-2288
        run: |
          set -euo pipefail
          npx --yes vercel@59.19.1 whoami --token="$VERCEL_TOKEN"

          CODE=$(curl -sS -o /tmp/project.json -w "%{http_code}"             -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v9/projects/ai-hq-gateway?teamId=$VERCEL_TEAM_ID")

          if [ "$CODE" = "404" ]; then
            echo "ai-hq-gateway is missing; recreating it..."
            curl -fsS               -X POST               -H "Authorization: Bearer $VERCEL_TOKEN"               -H "Content-Type: application/json"               "https://api.vercel.com/v11/projects?teamId=$VERCEL_TEAM_ID"               --data '{"name":"ai-hq-gateway","framework":null,"rootDirectory":"gateway-v9"}'               | tee /tmp/project-created.json
          elif [ "$CODE" != "200" ]; then
            echo "Unexpected Vercel project lookup HTTP $CODE"
            cat /tmp/project.json || true
            exit 1
          else
            echo "ai-hq-gateway exists."
          fi

          URL=$(npx --yes vercel@59.19.1 deploy             --prod --yes             --token="$VERCEL_TOKEN"             --scope="$VERCEL_SCOPE"             --project ai-hq-gateway             --cwd .)

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Gateway URL: $URL"

      - name: Disable Vercel SSO protection for API gateway
        env:
          VERCEL_TOKEN: ${{ secrets.GATEWAY_VERCEL_TOKEN }}
        run: |
          npx --yes vercel@59.19.1 project protection disable ai-hq-gateway --sso --token="$VERCEL_TOKEN"

      - name: Verify health endpoint
        env:
          URL: https://ai-hq-gateway.vercel.app
        run: |
          set -euo pipefail
          sleep 5
          curl -fsSL "$URL/health" | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"sessionAuth":true' /tmp/health.json
          grep -q '"jobSigning":true' /tmp/health.json
          grep -q '"ownerConfigured":true' /tmp/health.json
          grep -q '"githubAuth":true' /tmp/health.json

      - name: Deployment summary
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### AI HQ V9 Gateway"
            echo ""
            echo "- Status: READY"
            echo "- URL: $URL"
            echo "- Health: OK"
            echo "- Vercel project is created/linked automatically."
          } >> "$GITHUB_STEP_SUMMARY"

  not-configured:
    needs: [preflight, validate]
    if: github.event_name != 'pull_request' && needs.preflight.outputs.ready != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deployment skipped safely
        run: |
          echo "Gateway source is valid."
          echo "Missing GitHub Actions secret name: GATEWAY_VERCEL_TOKEN"
          echo "Create the secret under repository Settings > Secrets and variables > Actions."
