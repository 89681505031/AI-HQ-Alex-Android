name: Deploy V9 Gateway

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-v9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate deployment secrets
        env:
          VERCEL_TOKEN: ${{ secrets.GATEWAY_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.GATEWAY_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.GATEWAY_VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || (echo "Missing GATEWAY_VERCEL_TOKEN" && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "Missing GATEWAY_VERCEL_ORG_ID" && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "Missing GATEWAY_VERCEL_PROJECT_ID" && exit 1)

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.GATEWAY_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.GATEWAY_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.GATEWAY_VERCEL_PROJECT_ID }}
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build gateway
        env:
          VERCEL_TOKEN: ${{ secrets.GATEWAY_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.GATEWAY_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.GATEWAY_VERCEL_PROJECT_ID }}
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy gateway to production
        env:
          VERCEL_TOKEN: ${{ secrets.GATEWAY_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.GATEWAY_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.GATEWAY_VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
