name: PhoneAI Core recovered APK

on:
  push:
    branches:
      - phoneai-core-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PHONEAI_OPENCL: "0"
      PHONEAI_NDK_VERSION: "29.0.13113456"

    steps:
      - name: Checkout PhoneAI branch
        uses: actions/checkout@v4

      - name: Reconstruct PhoneAI source bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p phoneai-build
          cat phoneai-bundle-v2/part_*.txt > PhoneAICore-0.16-build-min.b64
          echo "a61c9a9fa0535a478eae39b2d22cbfc1e627e7ad4bc018cec2ac8fbd024ad0ea  PhoneAICore-0.16-build-min.b64" | sha256sum -c -
          base64 -d PhoneAICore-0.16-build-min.b64 > PhoneAICore-0.16-build-min.zip
          echo "2ce4dd183c64ca7d47cf2b07e7095206337876d9bfec005a6d4317c416664d1c  PhoneAICore-0.16-build-min.zip" | sha256sum -c -
          unzip -q PhoneAICore-0.16-build-min.zip -d phoneai-build
          test -f phoneai-build/app/build.gradle.kts
          test -f phoneai-build/scripts/setup_llama.sh
          test -f phoneai-build/scripts/setup_whisper.sh
          test -f phoneai-build/scripts/setup_sherpa_onnx.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.22.1"

      - name: Prepare native AI dependencies
        working-directory: phoneai-build
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/*.sh || true
          ./scripts/setup_llama.sh
          ./scripts/setup_whisper.sh
          ./scripts/setup_sherpa_onnx.sh

      - name: Unify GGML runtime for Llama and Whisper
        working-directory: phoneai-build
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          if "libggml-base.so" not in s:
              anchor = "    buildFeatures {\n"
              block = """    packaging {
                  jniLibs {
                      pickFirsts += setOf(
                          "**/libggml.so",
                          "**/libggml-base.so",
                          "**/libggml-cpu.so"
                      )
                  }
              }

              """
              if anchor not in s:
                  raise SystemExit("Could not locate android packaging insertion point")
              s = s.replace(anchor, block + anchor, 1)
              p.write_text(s, encoding="utf-8")
          PY

      - name: Build PhoneAI debug APK
        working-directory: phoneai-build
        shell: bash
        run: |
          set -euxo pipefail
          GGML_HOME="$PWD/third_party/llama.cpp/ggml"
          test -d "$GGML_HOME"
          gradle :app:assembleDebug -PGGML_HOME="$GGML_HOME" --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find phoneai-build/app/build/outputs/apk/debug -name '*.apk' -type f | head -1)"
          test -n "$APK"
          cp "$APK" PhoneAI-Core-recovered-debug.apk
          sha256sum PhoneAI-Core-recovered-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneAI-Core-recovered-debug
          path: PhoneAI-Core-recovered-debug.apk
          if-no-files-found: error
          retention-days: 14
